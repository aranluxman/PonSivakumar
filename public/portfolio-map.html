<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Map | Pon Sivakumar Commercial Real Estate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
claude/improve-website-design-UFcOL
        --navy: #0d1b2a;
        --navy-mid: #0f2236;
        --navy-deep: #091520;
        --navy: #0d1b2e;
        main
        --gold: #c9a84c;
        --gold-light: #e8c96a;
        --cream: #f0ede4;
        --cream-hover: #fffbf0;
        --water: #1d3a5f;
        --water-light: #254d7a;
        --white: #ffffff;
        --ink: #0d1b2e;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--navy);
        color: var(--white);
        font-family: "Inter", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Outer wrapper ── */
      .map-page {
        min-height: 100vh;
        padding: clamp(48px, 7vw, 80px) clamp(16px, 4vw, 40px) clamp(36px, 5vw, 60px);
        background:
 claude/improve-website-design-UFcOL
          radial-gradient(ellipse 70% 40% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 60%),
          linear-gradient(180deg, #0d1b2a 0%, #091520 100%);
          radial-gradient(circle at 50% 18%, rgba(201, 168, 76, 0.1), transparent 28%),
          linear-gradient(180deg, #0d1b2e 0%, #091522 100%);
        overflow: hidden;
 main
      }

      .map-shell {
        width: min(1100px, 100%);
        margin: 0 auto;
      }

      /* ── Heading ── */
      .map-heading {
        text-align: center;
        margin-bottom: 32px;
      }

      .map-heading .label {
        display: inline-block;
        margin: 0 0 14px;
        color: var(--gold);
        font-size: 0.7rem;
        font-weight: 900;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }

      .map-heading h2 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.4rem, 5.5vw, 4.6rem);
        font-weight: 700;
        line-height: 1.02;
        color: var(--white);
        letter-spacing: -0.02em;
      }

      .heading-rule {
        width: 64px;
        height: 2px;
        margin: 20px auto 0;
        background: linear-gradient(90deg, var(--gold), var(--gold-light), transparent);
        border-radius: 99px;
      }

      /* ── Stats bar ── */
      .stats-bar {
        display: flex;
        justify-content: center;
        align-items: stretch;
        border-top: 1px solid rgba(201,168,76,0.3);
        border-bottom: 1px solid rgba(201,168,76,0.3);
        margin: 0 auto 36px;
        max-width: 860px;
      }

      .stat-item {
        flex: 1 1 0;
        min-width: 0;
        padding: 20px 24px;
        text-align: center;
        position: relative;
      }

      .stat-item + .stat-item::before {
        content: "";
        position: absolute;
        left: 0;
        top: 20%;
        bottom: 20%;
        width: 1px;
        background: rgba(201,168,76,0.55);
      }

      .stat-num {
        display: block;
        color: var(--gold);
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(1.8rem, 3.8vw, 3rem);
        font-weight: 700;
        line-height: 1;
      }

      .stat-label {
        display: block;
        margin-top: 7px;
        color: rgba(255,255,255,0.75);
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* ── Map container ── */
      .map-frame {
        position: relative;
 claude/improve-website-design-UFcOL
        width: 100%;
        border-radius: 20px;

        width: min(980px, 100%);
        margin: 0 auto;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.025);
        box-shadow: 0 4px 40px rgba(0, 0, 0, 0.16);
 main
        overflow: hidden;
        background: linear-gradient(160deg, #0f2744 0%, #091a2e 100%);
        box-shadow:
          0 0 0 1px rgba(201,168,76,0.18),
          0 24px 80px rgba(0,0,0,0.4);
      }

      .map-frame svg {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Region fills */
      .water-body {
        fill: var(--water);
      }

      .water-body-light {
        fill: var(--water-light);
        opacity: 0.7;
      }

      .region {
        fill: var(--cream);
        stroke: rgba(15,39,68,0.5);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
        transition: fill 0.2s ease;
        cursor: default;
      }

      .region:hover {
        fill: var(--cream-hover);
      }

      .region--active {
        fill: #f5f0e0;
      }

      .water-label {
        fill: rgba(255,255,255,0.28);
        font-family: "Inter", Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
        user-select: none;
      }

      .region-label {
        fill: rgba(13,27,42,0.5);
        font-family: "Inter", Arial, sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        pointer-events: none;
        user-select: none;
      }

      /* Pin styles */
      .pin-group {
        cursor: pointer;
        transition: filter 0.2s ease;
      }

      .pin-group:hover,
      .pin-group:focus {
        /* Glow instead of scale — avoids bounds-change that triggers mouseleave glitch */
        filter: drop-shadow(0 0 6px rgba(201,168,76,0.95)) drop-shadow(0 0 14px rgba(201,168,76,0.5));
        outline: none;
      }

      .pin-shadow {
        fill: rgba(0,0,0,0.2);
        rx: 50%;
      }

      .pin-body {
        fill: url(#pinGrad);
        filter: drop-shadow(0 3px 8px rgba(201,168,76,0.5));
      }

      .pin-hole {
        fill: rgba(255,255,255,0.9);
      }

      /* Popup */
      .map-popup {
        position: absolute;
        z-index: 30;
        width: 256px;
        background: var(--white);
        border-radius: 16px;
        box-shadow: 0 16px 64px rgba(0,0,0,0.22);
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        /* pointer-events enabled so mouse can drift into the popup without closing it */
        transform: translate(-50%, calc(-100% - 20px));
        transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
      }

      .map-popup.is-visible {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, calc(-100% - 28px));
      }

      .popup-header {
        background: var(--navy);
        padding: 14px 16px 12px;
        border-bottom: 2px solid var(--gold);
      }

      .popup-title {
        color: var(--white);
        font-family: "Playfair Display", Georgia, serif;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
      }

      .popup-badge {
        display: inline-block;
        margin-top: 5px;
        color: var(--gold);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .popup-body {
        padding: 12px 16px 14px;
        display: grid;
        gap: 7px;
      }

      .popup-stat {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        border-bottom: 1px solid #f0f0f0;
        padding-bottom: 6px;
      }

      .popup-stat:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .popup-stat-label {
        color: #8a949e;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        flex-shrink: 0;
      }

      .popup-stat-value {
        color: var(--ink);
        font-size: 11px;
        font-weight: 800;
        text-align: right;
      }

      /* Caret */
      .map-popup::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-bottom: none;
        border-top-color: var(--white);
      }

      /* Footnote */
      .map-footnote {
        margin-top: 20px;
        color: rgba(255,255,255,0.45);
        font-size: 0.78rem;
        font-style: italic;
        text-align: center;
        letter-spacing: 0.01em;
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        .stats-bar {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        .stat-item:nth-child(odd)::before { display: none; }

        .stat-item:nth-child(3),
        .stat-item:nth-child(4) {
          border-top: 1px solid rgba(201,168,76,0.3);
        }

        .map-frame {
          overflow-x: auto;
        }

        .map-frame svg {
          min-width: 680px;
        }

        .map-popup {
          width: min(256px, calc(100vw - 32px));
        }
      }

      @media (max-width: 400px) {
        .stats-bar {
          grid-template-columns: 1fr;
        }

        .stat-item::before { display: none !important; }

        .stat-item + .stat-item {
          border-top: 1px solid rgba(201,168,76,0.3);
        }
      }
    </style>
  </head>
  <body>

            <text class="region-label" x="505" y="318" text-anchor="middle">Durham</text>
            <text class="region-label" x="270" y="312" text-anchor="middle">Peel</text>
            <text class="region-label" x="252" y="420" text-anchor="middle">Halton</text>
            <text class="region-label" x="196" y="472" text-anchor="middle">Hamilton</text>
            <text class="region-label" x="388" y="376" text-anchor="middle">Toronto</text>
            <text class="region-label" x="618" y="370" text-anchor="middle">Northumb.</text>

    <script>
      const properties = {
        pin1: {
          name: "Kennedy & Denison Plaza",
          badge: "Retail Plaza · Active",
          stats: [
            ["Address", "Kennedy Rd & Cornett Dr"],
            ["GLA", "41,000 SF"],
            ["Lot", "4.12 Acres"],
            ["Occupancy", "100% Leased"],
            ["NOI", "$1.077M"],
            ["Upside", "Redevelopment Potential"]
          ]
        },
        pin2: {
          name: "Napanee Development Site",
          badge: "Land Development · Pipeline",
          stats: [
            ["Location", "Napanee, Ontario"],
            ["Type", "Mixed-Use / Seniors"],
            ["Status", "Planning Stage"],
            ["Strategy", "Long-term Development"]
          ]
        },
        pin3: {
          name: "Selby Independent Living",
          badge: "Multi-Family · Pipeline",
          stats: [
            ["Location", "Selby, Ontario"],
            ["Type", "Independent Living"],
            ["Status", "Development Phase"],
            ["Strategy", "Community Housing"]
          ]
        },
        pin4: {
          name: "Richmond Hill Commercial",
          badge: "Office · For Sale",
          stats: [
            ["MLS", "N12940302"],
            ["Price", "$2.398M"],
            ["Type", "Medical / Dental Office"],
            ["Location", "North Richvale, ON"]
          ]
        }
      };

      const svg   = document.getElementById("portfolioMap");
      const frame = document.getElementById("mapFrame");
      const popup = document.getElementById("mapPopup");
      const pins  = Array.from(document.querySelectorAll(".pin-group"));
      let activePin = null;
      let hideTimer = null;

      function buildPopup(prop) {
        const rows = prop.stats.map(([label, value]) =>
          `<div class="popup-stat">
            <span class="popup-stat-label">${label}</span>
            <span class="popup-stat-value">${value}</span>
          </div>`
        ).join("");
        return `
          <div class="popup-header">
            <div class="popup-title">${prop.name}</div>
            <span class="popup-badge">${prop.badge}</span>
          </div>
          <div class="popup-body">${rows}</div>
        `;
      }

      // Stable positioning: read SVG translate coords, convert via viewBox math.
      // This is never affected by CSS hover transforms on the pin, eliminating the glitch.
      function getPinAnchor(pin) {
        const t  = pin.getAttribute("transform") || "";
        const m  = t.match(/translate\(\s*([\d.]+)[,\s]+([\d.]+)\s*\)/);
        if (!m) return null;

        const svgX = parseFloat(m[1]);
        const svgY = parseFloat(m[2]);

        const svgRect   = svg.getBoundingClientRect();
        const frameRect = frame.getBoundingClientRect();
        const vb        = svg.viewBox.baseVal;

        return {
          left: svgRect.left - frameRect.left + svgX * (svgRect.width  / vb.width),
          top:  svgRect.top  - frameRect.top  + svgY * (svgRect.height / vb.height)
        };
      }

      function showPopup(pin) {
        clearTimeout(hideTimer);
        const prop = properties[pin.id];
        if (!prop) return;

        activePin       = pin;
        popup.innerHTML = buildPopup(prop);
        popup.setAttribute("aria-hidden", "false");

        const pos = getPinAnchor(pin);
        if (!pos) return;

        popup.style.left = `${pos.left}px`;
        popup.style.top  = `${pos.top}px`;
        popup.classList.add("is-visible");
      }

      function hidePopup() {
        activePin = null;
        popup.classList.remove("is-visible");
        popup.setAttribute("aria-hidden", "true");
      }

      pins.forEach(pin => {
        pin.addEventListener("mouseenter", () => showPopup(pin));
        pin.addEventListener("mouseleave", () => { hideTimer = setTimeout(hidePopup, 180); });
        pin.addEventListener("focus",      () => showPopup(pin));
        pin.addEventListener("blur",       () => { hideTimer = setTimeout(hidePopup, 180); });
        pin.addEventListener("touchstart", e => {
          e.preventDefault();
          e.stopPropagation();
          if (activePin === pin && popup.classList.contains("is-visible")) {
            hidePopup();
          } else {
            showPopup(pin);
          }
        }, { passive: false });
        pin.addEventListener("click", e => e.stopPropagation());
      });

      // Keep popup alive when mouse drifts briefly between pin and popup
      popup.addEventListener("mouseenter", () => clearTimeout(hideTimer));
      popup.addEventListener("mouseleave", () => { hideTimer = setTimeout(hidePopup, 180); });

      document.addEventListener("click",      e => { if (!frame.contains(e.target)) hidePopup(); });
      document.addEventListener("touchstart", e => { if (!frame.contains(e.target)) hidePopup(); }, { passive: true });
      window.addEventListener("resize",       () => { if (activePin) showPopup(activePin); });
    </script>
  </body>
</html>
