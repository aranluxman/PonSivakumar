<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Map | Pon Sivakumar Commercial Real Estate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0d1b2a;
        --gold: #c9a84c;
        --cream: #f0ede4;
        --water: #2a4a6b;
        --muted: rgba(255, 255, 255, 0.64);
        --white: #ffffff;
        --ink: #0d1b2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--navy);
        color: var(--white);
        font-family: "Inter", Arial, sans-serif;
      }

      .portfolio-map-section {
        width: 100%;
        min-height: 600px;
        padding: clamp(56px, 8vw, 96px) 20px;
        background:
          radial-gradient(circle at 50% 18%, rgba(201, 168, 76, 0.1), transparent 28%),
          linear-gradient(180deg, #0d1b2a 0%, #091522 100%);
        overflow: hidden;
      }

      .map-shell {
        width: min(1120px, 100%);
        margin: 0 auto;
      }

      .section-heading {
        text-align: center;
        margin-bottom: 30px;
      }

      .section-heading .label {
        margin: 0 0 10px;
        color: var(--gold);
        font-size: 0.76rem;
        font-weight: 900;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .section-heading h2 {
        margin: 0;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.7rem, 6vw, 5.1rem);
        font-weight: 700;
        line-height: 1;
        color: var(--white);
      }

      .stats-row {
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 0;
        margin: 0 auto 34px;
        border-top: 1px solid rgba(201, 168, 76, 0.35);
        border-bottom: 1px solid rgba(201, 168, 76, 0.35);
        max-width: 960px;
      }

      .stat-item {
        flex: 1 1 0;
        min-width: 0;
        padding: 18px 26px;
        text-align: center;
        position: relative;
      }

      .stat-item + .stat-item::before {
        content: "";
        position: absolute;
        left: 0;
        top: 22%;
        bottom: 22%;
        width: 1px;
        background: rgba(201, 168, 76, 0.7);
      }

      .stat-number {
        display: block;
        color: var(--gold);
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(1.9rem, 4vw, 3.2rem);
        font-weight: 700;
        line-height: 1;
      }

      .stat-label {
        display: block;
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.86);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .map-frame {
        position: relative;
        width: min(980px, 100%);
        margin: 0 auto;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.025);
        box-shadow: 0 4px 40px rgba(0, 0, 0, 0.16);
        overflow: hidden;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .water {
        fill: var(--water);
        opacity: 0.95;
      }

      .region {
        fill: var(--cream);
        stroke: rgba(255, 255, 255, 0.3);
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
        transition:
          fill 0.18s ease,
          opacity 0.18s ease;
      }

      .region:hover {
        fill: #fff8e6;
      }

      .shoreline {
        fill: none;
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 2;
      }

      .map-pin {
        cursor: pointer;
        transform-box: fill-box;
        transform-origin: center;
        transition:
          transform 0.2s ease,
          filter 0.2s ease;
      }

      .map-pin:hover,
      .map-pin:focus {
        transform: scale(1.25);
        filter: drop-shadow(0 0 8px #c9a84c);
        outline: none;
      }

      .pin-shape {
        fill: var(--gold);
      }

      .pin-dot {
        fill: var(--white);
      }

      .pin-hit-area {
        fill: transparent;
        pointer-events: all;
      }

      .map-popup {
        position: absolute;
        z-index: 20;
        width: 240px;
        padding: 16px;
        background: var(--white);
        color: var(--ink);
        border-left: 4px solid var(--gold);
        border-radius: 16px;
        box-shadow: 0 12px 60px rgba(0, 0, 0, 0.15);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 18px));
        transition:
          opacity 0.2s ease,
          transform 0.2s ease,
          visibility 0.2s ease;
      }

      .map-popup.is-visible {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, calc(-100% - 26px));
      }

      .map-popup::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -9px;
        width: 0;
        height: 0;
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 9px solid var(--gold);
        transform: translateX(-50%);
      }

      .popup-title {
        margin: 0;
        color: var(--ink);
        font-family: "Playfair Display", Georgia, serif;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.25;
      }

      .popup-badge {
        display: inline-block;
        margin-top: 8px;
        color: var(--gold);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .popup-divider {
        height: 1px;
        margin: 11px 0;
        background: rgba(13, 27, 42, 0.12);
      }

      .popup-stats {
        display: grid;
        gap: 7px;
      }

      .popup-stat {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 10px;
        align-items: start;
      }

      .popup-stat span:first-child {
        color: #7c8792;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.25;
      }

      .popup-stat span:last-child {
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.25;
      }

      .map-note {
        margin: 22px 0 0;
        color: rgba(255, 255, 255, 0.62);
        font-size: 0.92rem;
        font-style: italic;
        text-align: center;
      }

      @media (max-width: 760px) {
        .portfolio-map-section {
          padding-inline: 14px;
        }

        .stats-row {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stat-item:nth-child(3)::before {
          display: none;
        }

        .stat-item:nth-child(n + 3) {
          border-top: 1px solid rgba(201, 168, 76, 0.35);
        }

        .map-frame {
          overflow-x: auto;
        }

        .map-frame svg {
          min-width: 760px;
        }
      }

      @media (max-width: 520px) {
        .stats-row {
          grid-template-columns: 1fr;
        }

        .stat-item + .stat-item::before {
          display: none;
        }

        .stat-item:nth-child(n + 2) {
          border-top: 1px solid rgba(201, 168, 76, 0.35);
        }

        .map-popup {
          width: min(240px, calc(100vw - 42px));
        }
      }
    </style>
  </head>
  <body>
    <section class="portfolio-map-section" aria-labelledby="portfolio-map-title">
      <div class="map-shell">
        <div class="section-heading">
          <p class="label">PORTFOLIO</p>
          <h2 id="portfolio-map-title">Where We Invest</h2>
        </div>

        <div class="stats-row" aria-label="Portfolio statistics">
          <div class="stat-item">
            <span class="stat-number">15+</span>
            <span class="stat-label">Years Experience</span>
          </div>
          <div class="stat-item">
            <span class="stat-number">4+</span>
            <span class="stat-label">Active Markets</span>
          </div>
          <div class="stat-item">
            <span class="stat-number">$1M+</span>
            <span class="stat-label">NOI (Featured Asset)</span>
          </div>
          <div class="stat-item">
            <span class="stat-number">100%</span>
            <span class="stat-label">Occupancy Rate</span>
          </div>
        </div>

        <div class="map-frame" id="mapFrame">
          <svg
            id="portfolioMap"
            viewBox="0 0 800 600"
            role="img"
            aria-label="Interactive SVG map of Southern Ontario portfolio markets"
          >
            <path

            >
              <title>Lake Huron and Georgian Bay</title>
            </path>
            <path
              class="water"
              d="M0 493C56 477 114 476 174 497C226 516 279 519 338 504C414 485 478 492 534 526C589 559 668 571 800 547V600H0Z"
            >
              <title>Lake Erie</title>
            </path>
            <path
              class="water"
              d="M278 405C354 392 424 397 492 417C566 438 636 447 709 423C747 411 778 405 800 407V600H356C335 566 301 542 252 526C205 511 167 488 139 455C188 438 235 422 278 405Z"
            >
              <title>Lake Ontario</title>
            </path>

            <g id="regions" aria-label="Southern Ontario regions">
              <path
                id="simcoe-county"
                class="region"
                d="M240 137L325 111L417 135L452 209L420 260L319 259L254 225Z"
              >
                <title>Simcoe County</title>
              </path>
              <path
                id="york-region"
                class="region"
                d="M318 259L421 260L442 337L397 381L315 360L291 301Z"
              >
                <title>York Region</title>
              </path>
              <path
                id="durham-region"
                class="region"
                d="M442 269L534 287L570 350L536 401L438 374L397 337L421 260Z"
              >
                <title>Durham Region</title>
              </path>
              <path
                id="peel-region"
                class="region"
                d="M229 282L291 258L318 360L285 407L223 386L201 329Z"
              >
                <title>Peel Region</title>
              </path>
              <path
                id="halton-region"
                class="region"
                d="M223 386L285 407L302 454L260 495L200 469L181 419Z"
              >
                <title>Halton Region</title>
              </path>
              <path
                id="hamilton"
                class="region"
                d="M142 438L200 469L260 495L240 542L166 531L115 490Z"
              >
                <title>Hamilton</title>
              </path>
              <path
                id="city-of-toronto"
                class="region"
                d="M315 360L397 381L438 374L438 418L361 434L295 414Z"
              >
                <title>City of Toronto</title>
              </path>
              <path
                id="northumberland"
                class="region"
                d="M536 401L570 350L643 355L675 397L630 438L555 428Z"
              >
                <title>Northumberland</title>
              </path>
              <path
                id="hastings-county"
                class="region"
                d="M557 186L653 176L685 246L643 355L570 350L534 287Z"
              >
                <title>Hastings County</title>
              </path>
              <path
                id="prince-edward-county"
                class="region"
                d="M630 438L675 397L724 411L709 459L651 475Z"
              >
                <title>Prince Edward County</title>
              </path>
              <path
                id="frontenac-county"
                class="region"
                d="M685 246L770 262L800 320V385L724 411L675 397L643 355Z"
              >
                <title>Frontenac County</title>
              </path>
              <path
                id="lanark-county"
                class="region"
                d="M653 132L742 132L789 187L770 262L685 246L653 176Z"
              >
                <title>Lanark County</title>
              </path>
            </g>

            <path
              class="shoreline"
              d="M142 438C205 424 262 407 315 392C383 374 465 384 536 401C589 414 635 429 724 411"
            />

            <g id="pins" aria-label="Property locations">
              <g class="pin-anchor" transform="translate(374 309)">
                <g
                  class="map-pin"
                  data-property="pin1"
                  tabindex="0"

                  aria-label="Kennedy and Denison Plaza"
                >
                  <circle class="pin-hit-area" cx="0" cy="-31" r="30"></circle>
                  <path
                    class="pin-shape"
                    d="M0 0C0 0-20-19-20-35C-20-48-11-58 0-58C11-58 20-48 20-35C20-19 0 0 0 0Z"
                  ></path>
                  <circle class="pin-dot" cx="0" cy="-36" r="6"></circle>
                </g>
              </g>
              <g class="pin-anchor" transform="translate(626 346)">
                <g
                  class="map-pin"
                  data-property="pin2"
                  tabindex="0"
                  role="button"
                  aria-label="Napanee Development Site"
                >
                  <circle class="pin-hit-area" cx="0" cy="-31" r="30"></circle>
                  <path
                    class="pin-shape"
                    d="M0 0C0 0-20-19-20-35C-20-48-11-58 0-58C11-58 20-48 20-35C20-19 0 0 0 0Z"
                  ></path>
                  <circle class="pin-dot" cx="0" cy="-36" r="6"></circle>
                </g>
              </g>
              <g class="pin-anchor" transform="translate(704 319)">
                <g
                  class="map-pin"
                  data-property="pin3"
                  tabindex="0"
                  role="button"
                  aria-label="Selby Independent Living"
                >
                  <circle class="pin-hit-area" cx="0" cy="-31" r="30"></circle>
                  <path
                    class="pin-shape"
                    d="M0 0C0 0-20-19-20-35C-20-48-11-58 0-58C11-58 20-48 20-35C20-19 0 0 0 0Z"
                  ></path>
                  <circle class="pin-dot" cx="0" cy="-36" r="6"></circle>
                </g>
              </g>
              <g class="pin-anchor" transform="translate(345 293)">
                <g
                  class="map-pin"
                  data-property="pin4"
                  tabindex="0"
                  role="button"
                  aria-label="Richmond Hill Asset"
                >
                  <circle class="pin-hit-area" cx="0" cy="-31" r="30"></circle>
                  <path
                    class="pin-shape"
                    d="M0 0C0 0-20-19-20-35C-20-48-11-58 0-58C11-58 20-48 20-35C20-19 0 0 0 0Z"
                  ></path>
                  <circle class="pin-dot" cx="0" cy="-36" r="6"></circle>

              </g>
            </g>
          </svg>

          <div class="map-popup" id="mapPopup" aria-hidden="true"></div>
        </div>

        <p class="map-note">Portfolio includes current holdings and active pipeline projects.</p>
      </div>
    </section>

    <script>
      const properties = {
        pin1: {
          name: "Kennedy & Denison Plaza",
          badge: "Retail Plaza · Active",
          stats: {
            Address: "Kennedy Rd & Cornett Dr",
            Size: "41,000 SF",
            Lot: "4.12 Acres",
            Occupancy: "100% Leased",
            NOI: "$1.077M",
            Tenants: "CIBC, UPS Store, +8 more",
            Upside: "Redevelopment Potential"
          }
        },
        pin2: {
          name: "Napanee Development Site",
          badge: "Land Development · Pipeline",
          stats: {
            Location: "Napanee, Ontario",
            Type: "Seniors Housing / Mixed-Use",
            Status: "Planning Stage",
            Strategy: "Long-term development"
          }
        },
        pin3: {
          name: "Selby Independent Living",
          badge: "Multi-Family · Pipeline",
          stats: {
            Location: "Selby, Ontario",
            Type: "Independent Living Project",
            Status: "Development Phase",
            Strategy: "Community housing"
          }
        },
        pin4: {
          name: "Richmond Hill Asset",
          badge: "Industrial · GTA North",
          stats: {
            Location: "Richmond Hill, Ontario",
            Type: "Industrial / Commercial",
            Status: "Active",
            Strategy: "Cash flow + appreciation"
          }
        }
      };

      const frame = document.getElementById("mapFrame");
      const popup = document.getElementById("mapPopup");
      const pins = Array.from(document.querySelectorAll(".map-pin"));
      let activePin = null;
      let hideTimer = null;

      function popupMarkup(property) {
        const stats = Object.entries(property.stats)
          .map(
            ([label, value]) =>
              `<div class="popup-stat"><span>${label}</span><span>${value}</span></div>`
          )
          .join("");

        return `
          <h3 class="popup-title">${property.name}</h3>
          <span class="popup-badge">${property.badge}</span>
          <div class="popup-divider"></div>
          <div class="popup-stats">${stats}</div>
        `;
      }

      function showPopup(pin) {
        window.clearTimeout(hideTimer);
        const property = properties[pin.dataset.property];
        if (!property) return;

        activePin = pin;
        popup.innerHTML = popupMarkup(property);
        popup.setAttribute("aria-hidden", "false");

        const frameRect = frame.getBoundingClientRect();
        const pinRect = pin.getBoundingClientRect();
        const left = pinRect.left + pinRect.width / 2 - frameRect.left;
        const top = pinRect.top - frameRect.top;

        popup.style.left = `${left}px`;
        popup.style.top = `${top}px`;
        popup.classList.add("is-visible");
      }

      function hidePopup() {
        activePin = null;
        popup.classList.remove("is-visible");
        popup.setAttribute("aria-hidden", "true");
      }

      pins.forEach((pin) => {
        pin.addEventListener("mouseenter", () => showPopup(pin));
        pin.addEventListener("mouseleave", () => {
          hideTimer = window.setTimeout(hidePopup, 110);
        });
        pin.addEventListener("focus", () => showPopup(pin));
        pin.addEventListener("blur", hidePopup);
        pin.addEventListener("touchstart", (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (activePin === pin && popup.classList.contains("is-visible")) {
            hidePopup();
          } else {
            showPopup(pin);
          }
        });
        pin.addEventListener("click", (event) => {
          event.stopPropagation();
        });
      });

      document.addEventListener("touchstart", (event) => {
        if (!frame.contains(event.target)) hidePopup();
      });

      document.addEventListener("click", (event) => {
        if (!frame.contains(event.target)) hidePopup();
      });

      window.addEventListener("resize", () => {
        if (activePin) showPopup(activePin);
      });
    </script>
  </body>
</html>
