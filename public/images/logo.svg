<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 56" role="img" aria-label="Pon Sivakumar Commercial Real Estate">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8c96a"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal icon background -->
  <polygon points="28,2 50,14 50,38 28,50 6,38 6,14" fill="#0d1b2a"/>
  <!-- Hexagonal gold border -->
  <polygon points="28,5 47,16 47,36 28,49 9,36 9,16" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Building silhouette inside hex -->
  <rect x="19" y="22" width="18" height="16" fill="url(#goldGrad)" rx="0.5"/>
  <rect x="23" y="16" width="10" height="8" fill="url(#goldGrad)" rx="0.5"/>
  <rect x="26" y="12" width="4" height="6" fill="url(#goldGrad)" rx="0.5"/>
  <!-- Windows -->
  <rect x="21" y="25" width="3" height="3" fill="#0d1b2a" rx="0.3"/>
  <rect x="26" y="25" width="3" height="3" fill="#0d1b2a" rx="0.3"/>
  <rect x="31" y="25" width="3" height="3" fill="#0d1b2a" rx="0.3"/>
  <rect x="21" y="31" width="3" height="3" fill="#0d1b2a" rx="0.3"/>
  <rect x="26" y="31" width="3" height="3" fill="#0d1b2a" rx="0.3"/>
  <rect x="31" y="31" width="3" height="3" fill="#0d1b2a" rx="0.3"/>
  <rect x="25" y="19" width="3" height="3" fill="#0d1b2a" rx="0.3"/>

  <!-- Divider line -->
  <line x1="62" y1="10" x2="62" y2="46" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- PON SIVAKUMAR text -->
  <text x="74" y="26" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" letter-spacing="1" fill="currentColor">PON SIVAKUMAR</text>
  <!-- Descriptor text -->
  <text x="74" y="40" font-family="Arial,Helvetica,sans-serif" font-size="7" font-weight="800" letter-spacing="2.5" fill="url(#goldGrad)">COMMERCIAL REAL ESTATE</text>
</svg>
